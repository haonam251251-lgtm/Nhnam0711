<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>DOANHTHU</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
/* ===== LAYOUT ===== */
body {
    margin: 0;
    background-color: #EFEFEA;
}

.layout {
    display: flex;
    min-height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
    width: 240px;
    background-image: url(../H%C3%ACnh%20%E1%BA%A3nh/MauChuyenSac.png);
    background-size: cover;
    background-position: center;
    color: #fff;
    padding: 20px;
}

.sidebar-avatar {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #fff;
}

.sidebar-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ===== MENU ===== */
.menu {
    list-style: none;
    padding: 0;
    margin: 0;
}

.menu li {
    margin-bottom: 10px;
}

.menu a {
    position: relative;
    display: block;
    padding: 12px 14px;
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    border-radius: 8px;
    z-index: 1;
}

.menu a::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% + 20px);
    height: 100%;
    background-color: #EFEFEA;
    border-radius: 999px 0 0 100px;
    opacity: 0;
    transition: 0.2s;
    z-index: -1;
}

.menu a:hover::before,
.menu a.active::before {
    opacity: 1;
}

.menu a:hover,
.menu a.active {
    color: #0d6efd;
}

/* ===== MAIN ===== */
.main-content {
    flex: 1;
    padding: 30px;
}

/* ================= BIỂU ĐỒ ================= */

.chart-wrapper {
    display: flex;
}

.y-axis {
    width: 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 13px;
    text-align: right;
    padding-right: 10px;
    color: #555;
}

.chart {
    height: 760px;      /* tăng thêm 60px */
    padding-top: 50px;  /* CHỪA CHỖ CHO SỐ 1300 */
}


.chart > div {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

/* ===== CỘT ===== */
.bar {
    width: 100%;
    border-radius: 6px 6px 0 0;
    position: relative;
    transition: 0.3s;
}

.bar:hover {
    opacity: 0.85;
}

/* ===== SỐ TRÊN ĐẦU CỘT ===== */
.bar span {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 600;
    color: #000;
}

/* ===== MÀU ===== */
.up { background-color: #0d6efd; }

/* ===== CHIỀU CAO (CHUẨN 1300 = 100%) ===== */
.h-15  { height: 15%; }   /* 200 */
.h-23  { height: 23%; }   /* 300 */
.h-31  { height: 31%; }   /* 400 */
.h-38  { height: 38%; }   /* 500 */
.h-46  { height: 46%; }   /* 600 */
.h-54  { height: 54%; }   /* 700 */
.h-62  { height: 62%; }   /* 800 */
.h-69  { height: 69%; }   /* 900 */
.h-77  { height: 77%; }   /* 1000 */
.h-85  { height: 85%; }   /* 1100 */
.h-92  { height: 92%; }   /* 1200 */
.h-100 { height: 100%; }  /* 1300 */

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; display: flex; gap: 15px; }
    .menu { display: flex; gap: 10px; flex-wrap: wrap; }
}
</style>
</head>

<body>
<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-avatar">
        <img src="../Hình ảnh/avatar.png" alt="">
    </div>
    <ul class="menu">
        <li><a href="../QUANTRI.html">TRANG CHỦ</a></li>
        <li><a href="SANPHAM.html">SẢN PHẨM</a></li>
        <li><a href="DOANHTHU.html">DOANH THU</a></li>
        <li><a href="DONHANG.html">ĐƠN HÀNG</a></li>
        <li><a href="KHACHHANG.html">KHÁCH HÀNG</a></li>        
    </ul>
</div>

<!-- MAIN -->
<div class="main-content">

<h2 class="fw-bold text-center mb-4">
TỐC ĐỘ TĂNG TRƯỞNG DOANH THU GIAI ĐOẠN 2024 – 2025
</h2>

<div class="card">
<div class="card-header fw-bold">Doanh thu theo tháng</div>
<div class="card-body">

<div class="chart-wrapper">

<!-- TRỤC Y -->
<div class="y-axis">
    <div><strong>TRIỆU VNĐ</strong></div>
    <div>1300</div>
    <div>1100</div>
    <div>900</div>
    <div>700</div>
    <div>500</div>
    <div>300</div>
    <div>100</div>
    <div>0</div>
</div>

<!-- BIỂU ĐỒ -->
<div class="row chart text-center flex-grow-1 align-items-end">

<div class="col-1"><div class="bar up h-15"><span>200</span></div><small>T1</small></div>
<div class="col-1"><div class="bar up h-23"><span>300</span></div><small>T2</small></div>
<div class="col-1"><div class="bar up h-31"><span>400</span></div><small>T3</small></div>
<div class="col-1"><div class="bar up h-38"><span>500</span></div><small>T4</small></div>
<div class="col-1"><div class="bar up h-46"><span>600</span></div><small>T5</small></div>

<div class="col-1"><div class="bar up h-62"><span>800</span></div><small>T7</small></div>
<div class="col-1"><div class="bar up h-69"><span>900</span></div><small>T8</small></div>
<div class="col-1"><div class="bar up h-77"><span>1000</span></div><small>T9</small></div>
<div class="col-1"><div class="bar up h-85"><span>1100</span></div><small>T10</small></div>
<div class="col-1"><div class="bar up h-92"><span>1200</span></div><small>T11</small></div>
<div class="col-1"><div class="bar up h-100"><span>1300</span></div><small>T12</small></div>

</div>
</div>
</div>
</div>

</div>
</div>
</body>
</html>
